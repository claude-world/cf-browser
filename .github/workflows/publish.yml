name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - both
          - sdk
          - mcp-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check component versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            python scripts/check_versions.py --tag "$RELEASE_TAG"
          else
            python scripts/check_versions.py
          fi

      - name: Require the SDK on PyPI for MCP-only publication
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'mcp-server'
        run: python scripts/check_pypi_dependency.py

      # Run from the repository root, exactly like ci.yml: from inside sdk/,
      # Ruff resolves different settings for the mixed ../ paths.
      - name: Test SDK
        run: |
          python -m pip install -e './sdk[dev]'
          python -m ruff format --check sdk/src sdk/tests examples scripts
          python -m ruff check sdk/src sdk/tests examples scripts
          python -m mypy --config-file sdk/pyproject.toml sdk/src
          python -m pytest -q sdk/tests

      - name: Test Worker
        working-directory: worker
        run: |
          npm ci
          npm audit --audit-level=high
          npm run type-check
          npm test

      - name: Test MCP Server
        working-directory: mcp-server
        run: |
          pip install -e ../sdk
          pip install -e ".[dev]"
          ruff format --check src tests
          ruff check src tests
          mypy src
          pytest tests/ -q

      - name: Validate setup script
        run: |
          bash -n setup.sh
          shellcheck setup.sh scripts/test_setup.sh
          bash scripts/test_setup.sh

  # Build from a fresh checkout with pinned tools only, so nothing installed
  # while testing (dev dependencies, npm packages) can alter the artifacts.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 twine==7.0.0

      - name: Build and verify SDK artifact
        run: |
          python -m build sdk
          python -m twine check --strict sdk/dist/*
          python scripts/verify_python_dist.py sdk --require-py-typed

      - name: Build and verify MCP artifact
        run: |
          python -m build mcp-server
          python -m twine check --strict mcp-server/dist/*
          python scripts/verify_python_dist.py mcp-server

      - name: Upload SDK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: sdk/dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload MCP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-dist
          path: mcp-server/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-sdk:
    needs: build
    if: >
      github.event_name == 'release' ||
      github.event.inputs.package == 'both' ||
      github.event.inputs.package == 'sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-dist
          path: sdk-dist

      - name: Publish SDK to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk-dist/

  publish-mcp-server:
    needs: [build, publish-sdk]
    # Run if the build passed and SDK succeeded or was skipped (mcp-server-only publish)
    if: >
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped') &&
      (github.event_name == 'release' ||
       github.event.inputs.package == 'both' ||
       github.event.inputs.package == 'mcp-server')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified MCP artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-dist
          path: mcp-dist

      - name: Publish MCP Server to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: mcp-dist/
