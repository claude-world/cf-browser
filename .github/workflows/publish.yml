name: Publish to PyPI

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - both
          - sdk
          - mcp-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check component versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            python scripts/check_versions.py --tag "$RELEASE_TAG"
          else
            python scripts/check_versions.py
          fi

      - name: Require the SDK on PyPI for MCP-only publication
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package == 'mcp-server'
        run: python scripts/check_pypi_dependency.py

      - name: Test SDK
        working-directory: sdk
        run: |
          pip install -e ".[dev]"
          ruff format --check src tests ../examples ../scripts
          ruff check src tests ../examples ../scripts
          mypy src
          pytest tests/ -q

      - name: Test Worker
        working-directory: worker
        run: |
          npm ci
          npm audit --audit-level=high
          npm run type-check
          npm test

      - name: Test MCP Server
        working-directory: mcp-server
        run: |
          pip install -e ../sdk
          pip install -e ".[dev]"
          ruff format --check src tests
          ruff check src tests
          mypy src
          pytest tests/ -q

      - name: Validate setup script
        run: |
          bash -n setup.sh
          shellcheck setup.sh scripts/test_setup.sh
          bash scripts/test_setup.sh

      - name: Build and verify SDK artifact
        run: |
          python -m build sdk
          python -m twine check sdk/dist/*
          python scripts/verify_python_dist.py sdk --require-py-typed

      - name: Build and verify MCP artifact
        run: |
          python -m build mcp-server
          python -m twine check mcp-server/dist/*
          python scripts/verify_python_dist.py mcp-server

      - name: Upload SDK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-dist
          path: sdk/dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload MCP artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcp-dist
          path: mcp-server/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-sdk:
    needs: test
    if: >
      github.event_name == 'release' ||
      github.event.inputs.package == 'both' ||
      github.event.inputs.package == 'sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sdk-dist
          path: sdk-dist

      - name: Publish SDK to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: sdk-dist/

  publish-mcp-server:
    needs: [test, publish-sdk]
    # Run if tests passed and SDK succeeded or was skipped (mcp-server-only publish)
    if: >
      always() &&
      needs.test.result == 'success' &&
      (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped') &&
      (github.event_name == 'release' ||
       github.event.inputs.package == 'both' ||
       github.event.inputs.package == 'mcp-server')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified MCP artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mcp-dist
          path: mcp-dist

      - name: Publish MCP Server to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: mcp-dist/
