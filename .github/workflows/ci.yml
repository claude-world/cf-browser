name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: sdk (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e './sdk[dev]'
      - run: python -m pytest -q sdk/tests
      - run: python -m compileall -q sdk/src examples scripts
      - if: matrix.python-version == '3.13'
        run: |
          python -m ruff format --check sdk/src sdk/tests examples scripts
          python -m ruff check sdk/src sdk/tests examples scripts
          python -m mypy --config-file sdk/pyproject.toml sdk/src
          python -m build sdk
          python -m twine check sdk/dist/*
          python scripts/verify_python_dist.py sdk --require-py-typed

  mcp-server:
    name: mcp-server (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e './sdk' -e './mcp-server[dev]'
      - run: python -m pytest -q mcp-server/tests
      - if: matrix.python-version == '3.13'
        run: |
          python -m ruff format --check mcp-server/src mcp-server/tests
          python -m ruff check mcp-server/src mcp-server/tests
          python -m mypy --config-file mcp-server/pyproject.toml mcp-server/src
          python -m build mcp-server
          python -m twine check mcp-server/dist/*
          python scripts/verify_python_dist.py mcp-server

  worker:
    name: worker (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run type-check
      - run: npm test
      - if: matrix.node-version == '22'
        run: |
          cp wrangler.toml.example wrangler.ci.toml
          npx wrangler deploy --dry-run --config wrangler.ci.toml

  setup-script:
    name: setup and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - run: bash -n setup.sh
      - run: shellcheck setup.sh scripts/test_setup.sh
      - run: bash scripts/test_setup.sh
      - run: python3 scripts/check_versions.py
