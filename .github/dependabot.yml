version: 2
updates:
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    groups:
      worker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /sdk
      - /mcp-server
    schedule:
      interval: monthly
    # The packages declare ">=" floors; only propose versions outside the range
    # (for example a new mcp major), not routine floor bumps.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
